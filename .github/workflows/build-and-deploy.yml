name: Build And Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_version: ${{ steps.image.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: image
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "image_version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_version }}
            ${{ steps.image.outputs.image_name }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/matigroup"
            fi

            # Try to authenticate to GHCR if token is provided
            # For public packages, this might not be needed, but it doesn't hurt
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "Authenticating to GHCR with token..."
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "No GHCR_TOKEN found. If package is public, pull should work without auth."
              echo "If you get 'denied' error, either:"
              echo "  1. Make package public: https://github.com/kiryyya?tab=packages → matigroup → Package settings → Change visibility"
              echo "  2. Add GHCR_TOKEN secret with Personal Access Token (read:packages scope)"
            fi

            cd "$DEPLOY_PATH"
            echo "Pre-deploy cleanup to avoid 'no space left on device'..."
            df -h || true
            docker system df || true
            docker compose --env-file .env.deploy rm -sf app || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker volume prune -f || true
            docker system prune -af --volumes || true
            df -h || true
            docker system df || true

            if [ ! -f scripts/ensure-schema.sh ]; then
              echo "scripts/ensure-schema.sh is missing on server, creating fallback copy..."
              mkdir -p scripts
              cat > scripts/ensure-schema.sh <<'EOF'
#!/usr/bin/env bash
set -euo pipefail

DEPLOY_DIR="${1:-$(pwd)}"
ENV_PROD_FILE="${2:-.env.prod}"

cd "$DEPLOY_DIR"

if [ ! -f "$ENV_PROD_FILE" ]; then
  echo "Schema check skipped: $ENV_PROD_FILE not found in $DEPLOY_DIR"
  exit 1
fi

if ! command -v psql >/dev/null 2>&1; then
  echo "psql is not installed on server. Install postgresql-client and retry deploy."
  exit 1
fi

db_url="$(grep '^DATABASE_URL=' "$ENV_PROD_FILE" | tail -n1 | cut -d'=' -f2- || true)"
if [ -z "$db_url" ]; then
  echo "DATABASE_URL is missing in $ENV_PROD_FILE"
  exit 1
fi

db_url="${db_url%\"}"
db_url="${db_url#\"}"

echo "Ensuring required columns exist..."
psql "$db_url" -v ON_ERROR_STOP=1 <<'SQL'
ALTER TABLE "categories"
ADD COLUMN IF NOT EXISTS "filters" json DEFAULT '[]'::json;

ALTER TABLE "projects"
ADD COLUMN IF NOT EXISTS "filter_values" json DEFAULT '{}'::json;

UPDATE "categories"
SET "filters" = '[]'::json
WHERE "filters" IS NULL;

UPDATE "projects"
SET "filter_values" = '{}'::json
WHERE "filter_values" IS NULL;
SQL

echo "Schema check/migration patch completed successfully."
EOF
            fi

            chmod +x scripts/deploy.sh scripts/rollback.sh scripts/ensure-schema.sh
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.image_version }}" "${{ needs.build-and-push.outputs.image_name }}"
            docker logs --tail 100 matigroup-app
