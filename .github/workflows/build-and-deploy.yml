name: Build And Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_version: ${{ steps.image.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: image
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "image_version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_version }}
            ${{ steps.image.outputs.image_name }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/matigroup"
            fi

            # Authenticate to GHCR if token is provided
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "Authenticating to GHCR..."
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || {
                echo "Warning: GHCR authentication failed, trying without auth (package might be public)"
              }
            else
              echo "No GHCR_TOKEN secret found. Assuming package is public or already authenticated."
            fi

            cd "$DEPLOY_PATH"
            
            chmod +x scripts/deploy.sh scripts/rollback.sh
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.image_version }}" "${{ needs.build-and-push.outputs.image_name }}"
            docker logs --tail 100 matigroup-app
