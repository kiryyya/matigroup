name: Build And Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_version: ${{ steps.image.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: image
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "image_version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_version }}
            ${{ steps.image.outputs.image_name }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/matigroup"
            fi

            echo "=== Deployment Diagnostics ==="
            echo "Deploy path: $DEPLOY_PATH"
            echo "Image: ${{ needs.build-and-push.outputs.image_name }}"
            echo "Version: ${{ needs.build-and-push.outputs.image_version }}"
            
            cd "$DEPLOY_PATH"
            
            echo "=== Checking required files ==="
            ls -la || echo "Cannot list files"
            [ -f docker-compose.yml ] && echo "✓ docker-compose.yml exists" || echo "✗ docker-compose.yml NOT FOUND"
            [ -f .env.deploy ] && echo "✓ .env.deploy exists" || echo "✗ .env.deploy NOT FOUND"
            [ -f .env.prod ] && echo "✓ .env.prod exists" || echo "✗ .env.prod NOT FOUND"
            [ -f scripts/deploy.sh ] && echo "✓ scripts/deploy.sh exists" || echo "✗ scripts/deploy.sh NOT FOUND"
            
            echo "=== Current .env.deploy content ==="
            cat .env.deploy || echo "Cannot read .env.deploy"
            
            echo "=== Docker status ==="
            docker ps -a | grep matigroup || echo "No matigroup containers found"
            
            echo "=== Running deploy script ==="
            chmod +x scripts/deploy.sh scripts/rollback.sh || true
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.image_version }}" "${{ needs.build-and-push.outputs.image_name }}" || {
              echo "=== Deploy failed, showing logs ==="
              docker logs --tail 100 matigroup-app || echo "Cannot get logs"
              exit 1
            }
            
            echo "=== Deploy success, showing final logs ==="
            docker logs --tail 100 matigroup-app || true
