name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_version: ${{ steps.image.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: image
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "image_version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_version }}
            ${{ steps.image.outputs.image_name }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY; do
            # values are masked; emptiness check via github context is enough for presence
            echo "Checking $name..."
          done
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing SSH_HOST / SSH_USER / SSH_KEY. Update GitHub Actions secrets to the current server."
            exit 1
          fi
          echo "SSH_HOST is set (length ${#SSH_HOST_VALUE})"
        env:
          SSH_HOST_VALUE: ${{ secrets.SSH_HOST }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/matigroup"
            fi

            echo "Deploy host=$(hostname) path=$DEPLOY_PATH version=${{ needs.build-and-push.outputs.image_version }}"

            # Try to authenticate to GHCR if token is provided
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "Authenticating to GHCR with token..."
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "No GHCR_TOKEN found. If package is public, pull should work without auth."
              echo "If you get 'denied' error, either:"
              echo "  1. Make package public: https://github.com/kiryyya?tab=packages → matigroup → Package settings → Change visibility"
              echo "  2. Add GHCR_TOKEN secret with Personal Access Token (read:packages scope)"
            fi

            cd "$DEPLOY_PATH"
            if [ ! -f scripts/deploy.sh ]; then
              echo "scripts/deploy.sh missing in $DEPLOY_PATH"
              ls -la
              exit 1
            fi

            echo "Pre-deploy cleanup to avoid 'no space left on device'..."
            df -h || true
            docker system df || true
            docker compose --env-file .env.deploy rm -sf app || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            # Never prune volumes: Postgres/MinIO data lives there.
            docker system prune -af || true
            df -h || true
            docker system df || true

            if ! command -v psql >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                if [ "$(id -u)" -eq 0 ]; then
                  apt-get update && apt-get install -y postgresql-client
                else
                  sudo apt-get update && sudo apt-get install -y postgresql-client
                fi
              fi
            fi

            chmod +x scripts/deploy.sh scripts/rollback.sh scripts/ensure-schema.sh
            # Schema patches run inside deploy.sh via scripts/ensure-schema.sh
            ./scripts/deploy.sh "${{ needs.build-and-push.outputs.image_version }}" "${{ needs.build-and-push.outputs.image_name }}"
            docker logs --tail 100 matigroup-app
